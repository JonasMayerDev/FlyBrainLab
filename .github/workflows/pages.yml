name: Publish replay viewer

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Embodied Fly Lab (3D replay, expert board, film): static files from web/ at the site root.
      # Also served under /lab/ so links shared earlier keep working.
      - run: mkdir site && cp -R web/. site/ && cp -R web site/lab
      - uses: actions/configure-pages@v5
        if: github.repository == 'valleebo/FlyBrainLab'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.repository == 'valleebo/FlyBrainLab'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
